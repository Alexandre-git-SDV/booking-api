version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: booking-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=booking_db

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: booking-api
    ports:
      - "8080:8080"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/booking_db
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - mongodb

volumes:
  mongodb_data: